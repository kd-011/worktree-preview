name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A merge made with GITHUB_TOKEN (auto-merge) does not trigger the push run,
  # so this keeps the badge honest.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test (${{ matrix.os }}, node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versions
        run: |
          node --version
          git --version
      - name: Test
        run: node --test
