# Publishes to npm and cuts the GitHub Release when a merge to main raises the version in package.json.
#
# To release: add a "## [x.y.z]" section to CHANGELOG.md, run `npm version <patch|minor|major> --no-git-tag-version`,
# and merge. Re-running a failed run finishes whatever is left, so a failed step does not need a new version.
#
# Until the package is on npm and NPM_TOKEN is set, the npm step is skipped with a notice and the Release is still made.
# Tags and releases made with GITHUB_TOKEN do not start other workflow runs, so nothing publishes twice.
#
# npm auth is NPM_TOKEN when it exists (a granular token with publish rights and bypass 2FA), otherwise trusted
# publishing over OIDC. OIDC needs one-time setup on npmjs.com after the first publish (Trusted publisher: this
# repository, publish.yml), npm 11.5.1 or later and `id-token: write`. Provenance needs the repository to stay public.
name: publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-node is not given a registry: it would write a placeholder token, which would stop OIDC from being used.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: What is left to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: node scripts/release.mjs plan
      - name: No npm token yet
        if: steps.plan.outputs.npm_skipped == 'true'
        run: echo "::notice title=npm publish skipped::The package is not on npm yet and the NPM_TOKEN secret is not set. The GitHub Release is still made. Add the secret and run this workflow to publish."
      - name: Install npm 11 for trusted publishing
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1
      - name: Tests
        if: steps.plan.outputs.publish == 'true' || steps.plan.outputs.release == 'true'
        run: npm test
      # Before publishing, so a missing changelog section cannot leave a version on npm with no release.
      - name: Release notes from CHANGELOG.md
        if: steps.plan.outputs.publish == 'true' || steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          else
            echo "NPM_TOKEN is not set: publishing with trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public --ignore-scripts
      - name: Tag and GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --target "${GITHUB_SHA}"
